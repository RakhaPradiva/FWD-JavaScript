<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Tugas 1 Javascript - 29 sept 2026</title>
	</head>
	<body>
		<h1>M. Rakha Bintang Pradiva - Universitas Bina Nusantara</h1>
		<h2>Tugas Petermuan 1 - Javascript</h2>

		<hr />
		<script type="text/javascript">
			// 1. Luas Persegi Panjang
			// Rumus : Luas = Panjang x Lebar

			// Membuat variabel untuk menyimpan panjang dan lebar
			let panjangPesegiPanjang = 5;
			let lebarPersegiPanjang = 10;

			// Menghitung luas menggunakan operator perkalian (*)
			let luasPersegiPanjang = panjangPesegiPanjang * lebarPersegiPanjang;

			// Menampilkan hasil luas persegi panjang
			document.write("<h2> Luas Persegi Panjang </h2>");
			document.write("Panjang : " + panjangPesegiPanjang + " cm <br>");
			document.write("Lebar   : " + lebarPersegiPanjang + " cm<br>");
			document.write("Luas    : " + luasPersegiPanjang + " cm <br><br><hr>");

			// 2. Luas Bujur Sangkar
			// Rumus : Luas = Sisi x Sisi

			// Membuat variabel untuk menyimpan panjang sisi
			let sisiBujurSangkar = 20;

			// Menghitung luas menggunakan operator perkalian (*)
			let luasBujurSangkar = sisiBujurSangkar * sisiBujurSangkar;

			// Menampilkan hasil luas bujur sangkar
			document.write("<h2> Luas Bujur Sangkar </h2>");
			document.write("Sisi    : " + sisiBujurSangkar + " cm <br>");
			document.write("Luas    : " + luasBujurSangkar + " cm <br><br><hr>");

			// 3. Luas Segitiga
			// Rumus: Luas = 1/2 * Alas x Tinggi

			// Membuat variabel untuk menyimpan alas dan tinggi
			let alasSegitiga = 20;
			let tinggiSegitiga = 30;

			// Menghitung luas menggunakan operator perkalian dan pembagian
			let luasSegitiga = (1 / 2) * alasSegitiga * tinggiSegitiga;

			// Menampilkan hasil luas segitiga
			document.write("<h2> Luas Segitiga </h2>");
			document.write("Alas    : " + alasSegitiga + " cm <br>");
			document.write("Tinggi  : " + tinggiSegitiga + " cm <br>");
			document.write("Luas    : " + luasSegitiga + " cm <br><br><hr>");
		</script>
	</body>
</html>
